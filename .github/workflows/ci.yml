name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest SDK cidre builds against: catches symbols and APIs
          # that only newer SDKs have.
          - os: macos-15
            xcode: /Applications/Xcode_16.app
            macos: macos_15_0
          # The current release SDK, the first with the Speech API.
          - os: macos-26
            xcode: /Applications/Xcode_26.6.app
            macos: macos_26_0
          # The only place the OS 27 API (MusicUnderstanding, Speech capture)
          # builds and runs. A preview image, so it may fail without failing
          # the run.
          - os: xcode-27
            xcode: /Applications/Xcode_27.app
            macos: macos_27_0
            preview: true

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.preview == true }}

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: ls apps
      run: ls -la /Applications
    - name: os ver
      run: sw_vers
    - name: switch xcode
      run: sudo xcode-select -s '${{ matrix.xcode }}'
    - name: list sdks
      run: xcodebuild -showsdks
    - name: macosx sdk version
      run: xcodebuild -version -sdk macosx

    - name: add targets
      run: >
          rustup target add aarch64-apple-ios &&
          rustup target add aarch64-apple-ios-sim &&
          rustup target add x86_64-apple-darwin &&
          rustup +nightly target add aarch64-apple-darwin &&
          rustup +nightly target add aarch64-apple-ios &&
          rustup component add rust-src --toolchain nightly-aarch64-apple-darwin

    - name: Build
      run: ./build.sh

    - name: Test ns
      run: 'RUST_BACKTRACE=1 cargo t --features="macos_14_0" ns::'

    - name: Test cf
      run: 'RUST_BACKTRACE=1 cargo t --features="macos_14_0" cf::'

    # The Swift bindings for this runner's OS, and the audit of every Swift
    # symbol they link, which skips what this OS is too old to have.
    # One test at a time, so a crash is reported against the test it happened
    # in rather than whichever were running beside it.
    - name: Test swift
      run: >
          RUST_BACKTRACE=1 cargo t --lib --features="${{ matrix.macos }},async" swift::
          -- --nocapture --test-threads=1

    # The runners keep no crash reports, so a crash is rerun under lldb, which
    # prints where it happened.
    - name: Backtrace
      if: failure()
      run: |
        BIN=$(cargo t --lib --features="${{ matrix.macos }},async" --no-run --message-format=json 2>/dev/null \
          | jq -r 'select(.profile.test == true and .target.name == "cidre") | .executable' | tail -1)
        echo "test binary: $BIN"
        lldb --batch \
          -o "settings set target.process.stop-on-exec false" \
          -o run \
          -k "thread backtrace all" \
          -k "register read" \
          -k "disassemble --pc --count 24" \
          -k "quit 1" \
          -- "$BIN" swift:: --nocapture --test-threads=1
